name: Bug report
description: Report reproducible incorrect behavior in CAE OpenUSD Plugins
title: "[BUG]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include confidential data or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: CAE OpenUSD Plugins version
      description: Provide the installed package version or source commit.
      placeholder: "0.1.2 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OS, OpenUSD version and flavor, compiler, Python version, and relevant dependencies.
    validations:
      required: true
  - type: input
    id: file_format
    attributes:
      label: File format
      description: Identify the affected file-format plugin and source format, when applicable.
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest self-contained example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, internal paths, and confidential information before posting.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
